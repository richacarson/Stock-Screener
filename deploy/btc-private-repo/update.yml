# Daily dashboard update — fetches new buys from Kraken/Coinbase and
# republishes the password-gated dashboard.
# Lives at .github/workflows/update.yml in the private btc-tracker repo.
name: Update BTC dashboard

on:
  schedule:
    - cron: "23 13 * * *" # daily, 13:23 UTC (~8:23am Central)
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch history and publish dashboard
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          COINBASE_API_KEY_NAME: ${{ secrets.COINBASE_API_KEY_NAME }}
          COINBASE_API_PRIVATE_KEY: ${{ secrets.COINBASE_API_PRIVATE_KEY }}
          PHANTOM_BTC_ADDRESSES: ${{ vars.PHANTOM_BTC_ADDRESSES }}
          BTC_DASHBOARD_URL: https://ocovjbvrtbxptqtucyqw.supabase.co/functions/v1/btc-dashboard
          BTC_PUBLISH_TOKEN: ${{ secrets.BTC_PUBLISH_TOKEN }}
        run: |
          python scripts/btc_tracker.py fetch
          python scripts/btc_tracker.py publish
